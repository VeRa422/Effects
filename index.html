<div id="FX_ROOT">
  <meta charset="UTF-8">
  <style>
    #FX_ROOT, #FX_ROOT * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
    
    #FX_ROOT {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #121212; color: #e0e0e0; padding: 15px; border-radius: 16px;
      max-width: 880px; width: 100%; margin: 5px auto; border: 1px solid #333; 
      display: flex; flex-direction: column; overflow: hidden;
      line-height: 1.3; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }

    .fx-header { margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; flex-shrink: 0; }
    .fx-header h2 { color: #4ecca3; font-size: 17px; text-align: center; letter-spacing: 1px; }
    
    .editor-grid { display: grid; grid-template-columns: 290px 1fr; gap: 15px; flex-grow: 1; min-height: 0; }
    
    .controls-panel { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 8px; max-height: 440px; }
    .controls-panel::-webkit-scrollbar { width: 4px; }
    .controls-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

    .preview-panel { background: #000; border-radius: 12px; position: relative; min-height: 350px; border: 2px solid #222; overflow: hidden; }
    
    .input-item { display: flex; flex-direction: column; gap: 3px; }
    .input-item label { font-size: 10px; color: #888; text-transform: uppercase; font-weight: bold; }
    
    #FX_ROOT input[type="text"], #FX_ROOT select { 
      width: 100%; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 7px 10px; border-radius: 8px; font-size: 12px; outline: none;
    }
    
    #FX_ROOT input[type="range"] { cursor: pointer; accent-color: #4ecca3; height: 14px; }
    
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
    .btn-add { background: #34495e; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; }
    .btn-reset { background: #c0392b; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; }
    
    .btn-copy { 
      background: #4ecca3; color: #000; border: none; padding: 14px; border-radius: 12px; 
      font-weight: bold; cursor: pointer; width: 100%; margin-top: 12px; font-size: 14px; flex-shrink: 0;
    }
    
    .check-row { display: flex; align-items: center; gap: 8px; font-size: 11px; cursor: pointer; padding: 2px 0; color: #bbb; }
    canvas { display: block; width: 100%; height: 100%; }
    #hidden-copy-field { position: absolute; left: -9999px; }

    /* ДОБАВЛЕННЫЕ СТИЛИ ДЛЯ ЛОГОТИПА И ПОДПИСИ */
    .fx-footer { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; font-size: 11px; color: #666; font-weight: bold; letter-spacing: 0.5px; }
    .fx-footer img { height: 24px; border-radius: 4px; }
  </style>

  <div class="fx-header"><h2>✨ ИГРОВОЙ КВАРТАЛ ✨</h2></div>

  <div class="editor-grid">
    <div class="controls-panel">
      <div class="input-item">
        <label>Эффекты</label>
        <select id="f-shape">
          <optgroup label="Класска">
            <option value="circle">● Неоновые точки</option>
            <option value="⭐">⭐ Золотые звёзды</option>
            <option value="✨">✨ Сияющие звёзды</option>
          </optgroup>
          <optgroup label="Природа">
            <option value="💧">💧 Капли</option>
            <option value="❄️">❄️ Снежинки</option>
            <option value="🔥">🔥 Огонь</option>
            <option value="🍀">🍀 Клевер</option>
            <option value="🌼">🌼 цветы</option>
            <option value="🍁">🍁 Листья</option>
          </optgroup>
          <optgroup label="Космос">
            <option value="🌙">🌙 Луна</option>
            <option value="☀️">☀️ Солнце</option>
            <option value="🚀">🚀 Рокеты</option>
            <option value="🪐">🪐 Планеты</option>
          </optgroup>
          <optgroup label="Животные\Насекомые">
            <option value="🦋">🦋 Бабочки</option>
            <option value="🦄">🦄 Единороги</option>
            <option value="🐱">🐱 Коты</option>
            <option value="🐘">🐘 Слоны</option>
            <option value="🐻">🐻 Медведи</option>
          </optgroup>
          <optgroup label="Другое">
            <option value="❤️">❤️ Сердца</option>
            <option value="💎">💎 бриллианты</option>
            <option value="🎈">🎈 Воздушные шарики</option>
            <option value="🍭">🍭 Леденцы</option>
          </optgroup>
        </select>
      </div>

      <div class="input-item">
        <label>Свой текст</label>
        <input type="text" id="f-text" placeholder="Введите свой текст или эмодзи...">
      </div>

      <div class="input-item">
        <label>Напрвление движения частиц</label>
        <select id="f-dir">
          <option value="random">Хаотично</option>
          <option value="down">Сверху вниз</option>
          <option value="up">Снизу вверх</option>
          <option value="center">Взрыв</option>
          <option value="right-down">По диагонали</option>
        </select>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="input-item">
          <label>Цвет</label>
          <input type="color" id="f-color" value="#4ecca3" style="height:32px; width:100%; border:none; padding:0; background:none; cursor:pointer;">
        </div>
        <div class="input-item">
          <label>Прозрачность</label>
          <input type="range" id="f-opacity" min="0.1" max="1" step="0.1" value="1">
        </div>
      </div>

      <div class="input-item"><label>Частота</label><input type="range" id="f-count" min="1" max="100" value="20"></div>
      <div class="input-item"><label>Скорость</label><input type="range" id="f-speed" min="0.1" max="10" step="0.1" value="2"></div>
      <div class="input-item"><label>Размер</label><input type="range" id="f-size" min="5" max="100" value="30"></div>
      
      <label class="check-row">
        <input type="checkbox" id="f-glow" checked> ✨ Эффект свечения
      </label>

      <div class="btn-group">
        <button class="btn-add" onclick="addLayer()">➕ ДОБАВИТЬ</button>
        <button class="btn-reset" onclick="resetAll()">🧹 УБРАТЬ ВСЁ</button>
      </div>
    </div>

    <div class="preview-panel" id="f-preview">
      <canvas id="f-canvas"></canvas>
    </div>
  </div>

  <button class="btn-copy" id="copy-btn" onclick="generateAndCopy()">КОПИРОВАТЬ КОД ДЛЯ GENIALLY</button>
  <textarea id="hidden-copy-field"></textarea>

  <div class="fx-footer">
    <img src="https://raw.githubusercontent.com/VeRa422/Effects/main/%D0%BB%D0%BE%D0%B3%D0%BE%D1%82%D0%B8%D0%BF%20%D0%BD%D0%BE%D0%B2%D1%8B%D0%B9.gif" alt="Логотип">
    <span>ИГРОВОЙ КВАРТАЛ. ВСЕ ПРАВА ЗАЩИЩЕНЫ</span>
  </div>

  <script>
    (function() {
      const cvs = document.getElementById('f-canvas'), ctx = cvs.getContext('2d'), box = document.getElementById('f-preview');
      let layers = [];
      function resize() { cvs.width = box.clientWidth; cvs.height = box.clientHeight; }
      window.addEventListener('resize', resize); resize();

      class Particle {
        constructor(c) { this.c = {...c}; this.init(true); }
        init(first) {
          const d = this.c.dir;
          if(d === 'center') { this.x = cvs.width/2; this.y = cvs.height/2; } 
          else if(first) { this.x = Math.random()*cvs.width; this.y = Math.random()*cvs.height; } 
          else {
            if(d === 'up') { this.x = Math.random()*cvs.width; this.y = cvs.height+50; }
            else if(d === 'down' || d === 'right-down') { this.x = Math.random()*cvs.width; this.y = -50; }
            else { this.x = Math.random()*cvs.width; this.y = Math.random()*cvs.height; }
          }
          const s = this.c.speed;
          if(d === 'down') { this.vx = 0; this.vy = s; }
          else if(d === 'up') { this.vx = 0; this.vy = -s; }
          else if(d === 'right-down') { this.vx = s*0.6; this.vy = s; }
          else { const a = Math.random()*Math.PI*2; this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s; }
        }
        update() {
          this.x += this.vx; this.y += this.vy;
          if(this.x < -150 || this.x > cvs.width+150 || this.y < -150 || this.y > cvs.height+150) this.init();
        }
        draw() {
          ctx.save(); ctx.globalAlpha = this.c.opacity;
          if(this.c.glow) { ctx.shadowBlur = this.c.size/2; ctx.shadowColor = this.c.color; }
          ctx.fillStyle = this.c.color;
          if(this.c.isCircle) { ctx.beginPath(); ctx.arc(this.x, this.y, this.c.size/4, 0, Math.PI*2); ctx.fill(); } 
          else { ctx.font = `${this.c.size}px Arial`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(this.c.content, this.x, this.y); }
          ctx.restore();
        }
      }

      window.addLayer = function() {
        const shapeVal = document.getElementById('f-shape').value;
        const textVal = document.getElementById('f-text').value;
        const conf = {
          content: textVal || shapeVal,
          isCircle: (shapeVal === 'circle' && !textVal),
          dir: document.getElementById('f-dir').value,
          color: document.getElementById('f-color').value,
          opacity: parseFloat(document.getElementById('f-opacity').value),
          speed: parseFloat(document.getElementById('f-speed').value),
          size: parseInt(document.getElementById('f-size').value),
          glow: document.getElementById('f-glow').checked
        };
        for(let i=0; i < parseInt(document.getElementById('f-count').value); i++) { layers.push(new Particle(conf)); }
        document.getElementById('f-text').value = '';
      };
      window.resetAll = function() { layers = []; };
      function loop() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        layers.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(loop);
      }
      loop();

      window.generateAndCopy = function() {
        if(layers.length === 0) return alert("Add some layers first!");
        const data = layers.map(p => p.c);
        const code = `<iframe style="width:100%;height:100%;border:none;background:transparent;" srcdoc='<body style="margin:0;overflow:hidden;background:transparent;"><meta charset="UTF-8"><canvas id="c"></canvas><script>const v=document.getElementById("c"),t=v.getContext("2d"),ps=${JSON.stringify(data)};function r(){v.width=window.innerWidth;v.height=window.innerHeight}window.onresize=r;r();ps.forEach(p=>{p.x=Math.random()*v.width;p.y=Math.random()*v.height;const s=p.speed;if(p.dir==="down"){p.vx=0;p.vy=s}else if(p.dir==="up"){p.vx=0;p.vy=-s}else if(p.dir==="right-down"){p.vx=s*0.6;p.vy=s}else{const a=Math.random()*6.28;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s}});function a(){t.clearRect(0,0,v.width,v.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<-150||p.x>v.width+150||p.y<-150||p.y>v.height+150){if(p.dir==="center"){p.x=v.width/2;p.y=v.height/2}else if(p.dir==="up"){p.x=Math.random()*v.width;p.y=v.height+50}else if(p.dir==="down"||p.dir==="right-down"){p.x=Math.random()*v.width;p.y=-50}else{p.x=Math.random()*v.width;p.y=Math.random()*v.height}}t.save();t.globalAlpha=p.opacity;if(p.glow){t.shadowBlur=p.size/2;t.shadowColor=p.color}t.fillStyle=p.color;if(p.isCircle){t.beginPath();t.arc(p.x,p.y,p.size/4,0,6.28);t.fill()}else{t.font=p.size+"px Arial";t.textAlign="center";t.textBaseline="middle";t.fillText(p.content,p.x,p.y)}t.restore()});requestAnimationFrame(a)}a();<\/script>'></iframe>`;
        const f = document.getElementById('hidden-copy-field'); f.value = code; f.select(); document.execCommand('copy');
        alert("Success! Now paste this into Genially.");
      };
    })();
  </script>
</div>
